[project]
name = "livesubtitle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pillow==12.3.0",
    "pyaudiowpatch==0.2.12.8",
    "pyqt6==6.11.0",
    "pystray==0.19.5",
